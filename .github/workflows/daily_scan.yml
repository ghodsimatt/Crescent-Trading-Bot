name: Crescent Trading 5-Min Scan

on:
  schedule:
    # Runs every 5 minutes from 9am to 4pm EST (Mon-Fri)
    - cron: '*/5 14-20 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          ref: main
          fetch-depth: 0 # FIX 1: Download full history so we can sync properly

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Trading Bot
        run: python bot.py

      - name: Save Alert History
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          
          # FIX 2: Download changes from the server BEFORE we try to commit
          # This prevents the "Updates were rejected" error
          git pull origin main
          
          git add alert_log.json || true
          
          if git diff-index --quiet HEAD; then
            echo "No changes to history. Skipping save."
          else
            git commit -m "Update alert history"
            git push origin main
          fi
