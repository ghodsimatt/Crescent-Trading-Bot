name: Crescent Trading 5-Min Scan

on:
  schedule:
    - cron: '*/5 14-20 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0  # CRITICAL FIX: Allows the bot to sync with the server

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Trading Bot
        run: python bot.py

      - name: Save Alert History
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          
          # 1. Add the file so we track it
          git add alert_log.json || true
          
          # 2. Check if the file actually changed
          if git diff-index --quiet HEAD; then
            echo "No changes to history. Skipping save."
          else
            # 3. Commit the change locally
            git commit -m "Update alert history"
            
            # 4. THE FIX: Download the latest website version and merge it
            git pull --rebase origin main
            
            # 5. Push the final result
            git push origin main
          fi
