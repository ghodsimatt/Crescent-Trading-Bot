name: Crescent Trading 5-Min Scan

on:
  schedule:
    - cron: '*/5 14-20 * * 1-5'
  workflow_dispatch:

# Fix permissions so the tool can write to the repo
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Trading Bot
        run: python bot.py

      - name: Auto-Save History
        # This tool AUTOMATICALLY fixes the "Push Rejected" error.
        # It detects changes, pulls the latest server updates, and pushes safely.
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Update alert history
          file_pattern: alert_log.json
