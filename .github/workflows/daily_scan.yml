name: Crescent Trading 5-Min Scan

on:
  schedule:
    # Runs every 5 minutes from 9am to 4pm EST (Mon-Fri)
    - cron: '*/5 14-20 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          ref: main  # Forces it to grab the specific branch

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Trading Bot
        run: python bot.py

      - name: Auto-Save History
        # THIS IS THE FIX. It replaces the manual git commands.
        # It handles the "Traffic Jam" error automatically.
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Update alert history
          file_pattern: alert_log.json
