name: Crescent Trading 5-Min Scan

on:
  schedule:
    # Runs every 5 minutes from 9am to 4pm EST (Mon-Fri)
    - cron: '*/5 14-20 * * 1-5'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Trading Bot
        # This scans and sends alerts. It does NOT try to save anything.
        run: python bot.py
