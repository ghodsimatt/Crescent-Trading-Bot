name: Crescent Trading 5-Min Scan

on:
  schedule:
    # Runs every 5 minutes from 9am to 4pm EST (Mon-Fri)
    - cron: '*/5 14-20 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          # Using 3.10 to ensure yfinance works correctly
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Trading Bot
        run: python bot.py

      - name: Save Alert History
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          
          # FIX: Sync with the server first
          git pull origin main --rebase
          
          # Prepare the file
          git add alert_log.json || true
          
          # Check if there are changes
          if git diff-index --quiet HEAD; then
            echo "No changes to history. Skipping save."
          else
            git commit -m "Update alert history"
            
            # FIX: Sync one last time before pushing to be 100% safe
            git pull origin main --rebase
            git push origin main
          fi
