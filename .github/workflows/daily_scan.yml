name: Crescent Trading 5-Min Scan

on:
  schedule:
    # Runs every 5 minutes from 9am to 4pm EST (Mon-Fri)
    - cron: '*/5 14-20 * * 1-5'
  workflow_dispatch:

# --- FIX 1: GIVE PERMISSION TO SAVE FILES ---
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          # --- FIX 2: FORCE PYTHON 3.11 (Crucial for yfinance) ---
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install yfinance pandas ta requests lxml

      - name: Run Trading Bot
        run: python bot.py

      - name: Save Alert History
        # --- FIX 3: PREVENT CRASH IF NOTHING TO SAVE ---
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add alert_log.json || true
          if git diff-index --quiet HEAD; then
            echo "No changes to history. Skipping save."
          else
            git commit -m "Update alert history"
            git push
          fi
